[project]
name = "forge"
version = "0.1.0"
description = "A pixel-art blacksmith that nags you about your tasks. Harness-agnostic task store + MCP server + heartbeat daemon."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "mcp>=2",
    "system-one-adapter[openai]>=0.1.4",
    "typesafe-sdk>=0.6",
    "pyyaml>=6",
]

[project.scripts]
forged = "forge.daemon:main"
forge = "forge.cli:main"
forge-mcp = "forge.mcp_server:main"
forge-sprite-preview = "forge.sprite.preview:main"
forge-sprite-icon = "forge.sprite.preview:icon_main"
forge-sprite-slice = "forge.sprite.slice:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]
sprite = ["pillow>=10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# local wall-clock is the point (quiet hours, "due in 3h"); tz-aware would be wrong here
ignore = ["DTZ"]

[tool.ruff.lint.per-file-ignores]
# walking a live accessibility tree: any node can go defunct between two calls, and logging
# each one would drown the journal in noise — skipping the node IS the handling
"src/forge/desktop/atspi.py" = ["S110", "S112"]
