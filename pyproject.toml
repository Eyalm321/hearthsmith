[project]
name = "hearthsmith"
version = "0.1.0"
description = "A pixel-art blacksmith that nags you about your tasks. Harness-agnostic task store + MCP server + heartbeat daemon."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "mcp>=2",
    "system-one-adapter[openai]>=0.1.4",
    "typesafe-sdk>=0.6",
    "pyyaml>=6",
    # his browser body: a DOM snapshot + CDP beats AT-SPI inside a page
    "jev-ultrafast @ git+https://github.com/browser-use/jev-ultrafast",
    # his voice: AuK zero-shot clone, served by the HF space (no GPU here big enough)
    "gradio_client>=1.0",
    "icalendar>=7.3.0",
    "recurring-ical-events>=3.8.2",
]

[project.scripts]
hearthsmithd = "hearthsmith.daemon:main"
hearthsmith = "hearthsmith.cli:main"
hearthsmith-mcp = "hearthsmith.mcp_server:main"
hearthsmith-sprite-preview = "hearthsmith.sprite.preview:main"
hearthsmith-sprite-icon = "hearthsmith.sprite.preview:icon_main"
hearthsmith-sprite-slice = "hearthsmith.sprite.slice:main"
hearthsmith-look = "hearthsmith.desktop.vision:_cli"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]
sprite = ["pillow>=10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hearthsmith"]

[tool.hatch.metadata]
# jev-ultrafast is a git dependency
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# local wall-clock is the point (quiet hours, "due in 3h"); tz-aware would be wrong here
ignore = ["DTZ"]

[tool.ruff.lint.per-file-ignores]
# walking a live accessibility tree: any node can go defunct between two calls, and logging
# each one would drown the journal in noise — skipping the node IS the handling
"src/hearthsmith/desktop/atspi.py" = ["S110", "S112"]
