# ~/.config/hearthsmith/config.yaml — every key optional; see src/hearthsmith/config.py
decide:
  backend: openrouter              # openrouter (Jev) | typesafe | adapter | rules
  adapter_model: deepseek/deepseek-v4.1-flash
  adapter_base_url: https://openrouter.ai/api/v1
  adapter_key_env: OPENROUTER_API_KEY
compose:
  ollama_url: http://admins-mac-mini.local:11434
  ollama_model: hf.co/ornith-ai/Ornith-1.5-9B-GGUF:Q5_K_M
  fallback_model: deepseek/deepseek-v4.1-flash
  judge_model: xiaomi/mimo-v2.6-flash     # condenses a goal org's state for the suggestion judge
hyperpanes:
  allow_pane_input: false          # /input is arbitrary command exec; keep off
  delegate_queue: hearthsmith
  delegate_enabled: false
  suggestions: observe             # a pane's ghost-text next prompt: observe (tell you) | accept (his own panes, Jev judges) | off
  suggestion_accept_min_p: 0.7     # accept below this confidence becomes ask
  suggestion_accept_roles: [impl, spec]   # agent-org panes he may press; goals-orch never
  suggestion_org_aware: true       # gather spec/siblings/bus/queue and condense before Jev
  suggestion_settle_s: 20          # unchanged this long before he mentions it      # turn on once a worker drains the queue
desktop:
  hands: false                 # true = he may use the real mouse/keyboard (exclusive)
  verify: true                 # one screenshot + vision check before reporting success
browser:
  binary: google-chrome-stable  # his own Chrome (136+ refuses remote debugging on the default profile)
  cdp_port: 9222
  autostart: true
nag:
  min_gap_minutes: 45
  quiet_hours: [23, 8]
  markdown_file: ~/tasks.md
  channels: [hyperpanes, notify]
voice:
  enabled: true                    # he says nags and answers out loud, on top of sprite/pane/notify
  engines: [pocket, auk, qwen]     # tried in order; pocket = CPU realtime stream, auk = HF space (best clone), qwen = GPU
  variant: "AuK-Flash ⚡"           # or "AuK (Base)": slower, cleaner
  qwen_url: http://127.0.0.1:7861  # ~/dev/hearthsmith-voice, hearthsmith-voice.service (Qwen3-TTS-0.6B, fp32)
  ref: assets/voice/dwarf.wav      # the clip IS the voice — swap it (and ref_text) and he sounds like someone else
  ref_text: assets/voice/dwarf.txt
  sink: ""                         # PipeWire sink name (`pactl list sinks short`); "" = default output
calendar:
  # feed URLs or .ics paths; "$NAME" reads the environment — keep secret links in ~/.config/hearthsmith/env
  feeds: ["$HEARTHSMITH_CALENDAR"]
  refresh_min: 15
  heads_up_min: 10                 # 0 = no heads-up before meetings
  hold_nags_in_meetings: true
ear:
  source: ""                       # PipeWire source for the mic (pactl list sources short); "" = default
  model: large-v3-turbo            # faster-whisper, local GPU
  language: en
  end_silence_s: 0.8               # pause that ends what you said
  conversation_idle_s: 45
  barge_in: true                   # talk over him and he stops
  hotkey: "<Super>j"
